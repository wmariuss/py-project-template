# One file for metadata, dependencies and every tool that has an opinion.
# PEP 621 for the project table, PEP 735 for dependency groups.

[project]
name = "py-project-template"
version = "0.1.0"
description = "Project description"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marius Stanca", email = "me@marius.xyz" }]
keywords = ["template", "cli", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = ["click>=8.1,<9"]

[project.scripts]
py-project-template = "py_project_template.cli:cli"

[project.urls]
Homepage = "https://github.com/wmariuss/py-project-template"
Source = "https://github.com/wmariuss/py-project-template"
Issues = "https://github.com/wmariuss/py-project-template/issues"
Changelog = "https://github.com/wmariuss/py-project-template/blob/master/CHANGELOG.md"

# Development tools are not an "extra": nobody installing this package wants
# them. PEP 735 groups keep them out of the published metadata entirely.
[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_project_template"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting, so isort is one less tool
    "UP",   # pyupgrade, keeps syntax current as the floor rises
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff's own
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use asserts freely.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["py_project_template"]
mypy_path = "src"
strict = true
warn_unreachable = true
# Third-party packages without type information should not fail the build.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["py_project_template"]
branch = true
# `python -m` runs in a separate process, so coverage cannot see it. It is
# covered by a subprocess test instead, which is the only way to test it
# honestly.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target. Raise it as the project grows; never lower it to
# make a build pass.
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

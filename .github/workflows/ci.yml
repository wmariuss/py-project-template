name: CI

# Actions are pinned to exact releases, not floating majors. A floating major
# is a moving target that can change what runs without a commit here, and it
# is not even guaranteed to exist: astral-sh/setup-uv stopped publishing one
# after v7. Dependabot bumps these weekly in one grouped pull request. Pinning
# to a commit SHA is stronger still, at the cost of a file nobody can read.

on:
  push:
    branches: [master, develop]
  pull_request:

# A newer push makes the running job irrelevant. Cancelling it returns the
# runner and shortens the feedback loop, which is the only thing CI is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top; jobs opt into more when they need it. A
# compromised action in a job without write scope cannot push anything.
permissions:
  contents: read

env:
  UV_VERSION: "0.12.17"

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck

  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      # One version failing should not hide whether the others pass.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: make test
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.python == '3.13'
        with:
          name: coverage
          path: build/coverage.xml
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: make audit

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build the distributions
        run: make build

      - name: Check the metadata PyPI would reject
        run: uv tool run twine check --strict build/dist/*

      # Built on every change, pushed only on a tag. A release should never be
      # the first time the Dockerfile is exercised.
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: py-project-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs, and not as root
        run: |
          docker run --rm py-project-template:ci --version
          test "$(docker run --rm --entrypoint id py-project-template:ci -u)" != "0"

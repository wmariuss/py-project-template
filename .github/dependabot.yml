version: 2

# Dependency updates arrive as small, reviewable pull requests every week.
# The alternative is one enormous upgrade every two years, which is how a
# project ends up pinned to a Python that went end of life.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Tooling moves fast and rarely breaks. One pull request, not six.
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
